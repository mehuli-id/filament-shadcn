# Pembaruan dependensi otomatis. CI (.github/workflows/tests.yml) menguji setiap PR,
# termasuk ViewCopiesTest yang gagal bila Filament mengubah view yang disalin package.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    versioning-strategy: increase-if-necessary
    groups:
      minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tests/ui
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      playwright:
        patterns: ['playwright*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ['*']
