<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login form dan gambar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button,input{font-family:inherit}
input::placeholder{color:#8A8A93}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px 40px; background: {{t.muted2}}; color: {{t.fg}}; font-family: {{s.font}}; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; align-items: center;">

  <div style="align-self: stretch; display: flex; justify-content: flex-end;">
    <div role="radiogroup" aria-label="Tema tampilan" style="display: flex; gap: 2px; padding: 2px; border: 1px solid {{t.border}}; border-radius: {{s.rBtn}}px; background: {{t.bg}};">
      <sc-for list="{{themeOpts}}" as="th" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{th.sel}}" aria-label="{{th.label}}" title="{{th.label}}" onClick="{{th.pick}}" style="width: 32px; height: 30px; border: 0; border-radius: {{th.r}}px; background: {{th.bg}}; color: {{th.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{th.icon}}"></path></svg>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 24px; margin-top: 48px;">
    <section style="display: flex; flex-wrap: wrap; flex-direction: {{dir}}; border: 1px solid {{t.border}}; border-radius: {{s.r}}px; background: {{t.bg}}; box-shadow: 0 1px 2px rgba(0,0,0,0.05); overflow: hidden;">

      <div style="flex: 1 1 360px; min-width: 0; box-sizing: border-box; padding: {{s.cardPad}}px; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
          <span style="width: 40px; height: 40px; border-radius: {{s.rSm}}px; background: {{t.primary}}; color: {{t.primaryFg}}; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21V12h6v9"></path></svg>
          </span>
          <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;">Selamat datang kembali</h1>
          <p style="margin: 0; color: {{t.muted}};">Masuk ke akun {{brand}} Anda</p>
        </div>

        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; gap: 10px; padding: 10px 12px; border: 1px solid {{t.errBorder}}; border-radius: {{s.rBtn}}px; background: {{t.errBg}}; color: {{t.errFg}}; font-size: 13px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v4M12 16h.01"></path></svg>
            <span>Terlalu banyak percobaan. Coba lagi dalam 59 detik.</span>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="li-email" style="font-size: 14px; font-weight: 500;">Email</label>
          <input id="li-email" type="email" autoComplete="email" placeholder="nama@contoh.id" style="height: {{s.h}}px; padding: 0 12px; border: 1px solid {{t.input}}; border-radius: {{s.rBtn}}px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; box-sizing: border-box; width: 100%; outline: none;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
            <label for="li-pass" style="font-size: 14px; font-weight: 500;">Kata sandi</label>
            <a href="#" style="font-size: 13px; text-underline-offset: 3px;">Lupa kata sandi?</a>
          </div>
          <div style="position: relative;">
            <input id="li-pass" type="{{passType}}" autoComplete="current-password" style="height: {{s.h}}px; padding: 0 44px 0 12px; border: 1px solid {{t.input}}; border-radius: {{s.rBtn}}px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; box-sizing: border-box; width: 100%; outline: none;">
            <button type="button" onClick="{{togglePass}}" aria-label="{{passLabel}}" aria-pressed="{{passPressed}}" style="position: absolute; top: 0; right: 0; width: 40px; height: {{s.h}}px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{passIcon}}"></path></svg>
            </button>
          </div>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 24px; cursor: pointer; font-size: 14px;">
          <input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{t.primary}};">
          Ingat saya
        </label>
        <button type="button" onClick="{{submit}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: {{s.h}}px; border: 0; border-radius: {{s.rBtn}}px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 14px; font-weight: 500; cursor: pointer; opacity: {{btnOpacity}};">
          <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
          </sc-if>
          {{btnLabel}}
        </button>

        <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: {{t.muted}};">
          <span style="flex-grow: 1; height: 1px; background: {{t.border}};"></span>
          Atau lanjut dengan
          <span style="flex-grow: 1; height: 1px; background: {{t.border}};"></span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{socials}}" as="so" hint-placeholder-count="3">
            <button type="button" aria-label="{{so.label}}" title="{{so.label}}" style="display: flex; align-items: center; justify-content: center; height: {{so.h}}px; border: 1px solid {{so.border}}; border-radius: {{so.r}}px; background: {{so.bg}}; color: {{so.fg}}; cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{so.icon}}"></path></svg>
            </button>
          </sc-for>
        </div>

        <p style="margin: 0; text-align: center; font-size: 14px; color: {{t.muted}};">Belum punya akun? <a href="#" style="color: {{t.fg}}; text-underline-offset: 3px;">Daftar</a></p>
      </div>

      <div style="flex: 1 1 360px; min-width: 0; min-height: 320px; position: relative; background: {{t.imgBg}}; color: {{t.imgFg}}; overflow: hidden;">
        <svg width="100%" height="100%" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; top: 0; left: 0;">
          <sc-for list="{{rings}}" as="rg" hint-placeholder-count="6">
            <circle cx="300" cy="140" r="{{rg.r}}" fill="none" stroke="currentColor" stroke-opacity="{{rg.o}}" stroke-width="1"></circle>
          </sc-for>
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="40">
            <circle cx="{{d.x}}" cy="{{d.y}}" r="1.5" fill="currentColor" fill-opacity="0.35"></circle>
          </sc-for>
        </svg>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 28px; display: flex; flex-direction: column; gap: 10px;">
          <span style="align-self: flex-start; font-size: 12px; font-weight: 500; padding: 3px 10px; border: 1px dashed currentColor; border-radius: {{s.rSm}}px;">[GAMBAR BRAND · 1200×1600]</span>
          <p style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.4; color: {{t.imgText}};">{{tagline}}</p>
        </div>
      </div>
    </section>

    <p style="margin: 0; text-align: center; font-size: 12px; line-height: 1.6; color: {{t.muted}};">Dengan melanjutkan, Anda menyetujui <a href="#" style="text-underline-offset: 3px;">Ketentuan Layanan</a> dan <a href="#" style="text-underline-offset: 3px;">Kebijakan Privasi</a> kami.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"style":{"editor":"enum","default":"nova","options":["vega","nova","maia","lyra"],"section":"shadcn"},"dark":{"editor":"boolean","default":false,"section":"shadcn"},"imageSide":{"editor":"enum","default":"kanan","options":["kanan","kiri"],"section":"Tata letak"},"error":{"editor":"boolean","default":false,"section":"Status"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPass: false, remember: false, loading: false, themeMode: 'system' };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    function set(o) { self.setState(o); }

    // ---- Token gaya (padanan style shadcn) ----
    var styles = {
      vega: { r: 14, rSm: 8, rBtn: 8, cardPad: 40, h: 40, font: "'Geist', system-ui, sans-serif" },
      nova: { r: 12, rSm: 6, rBtn: 6, cardPad: 32, h: 36, font: "'Geist', system-ui, sans-serif" },
      maia: { r: 28, rSm: 999, rBtn: 999, cardPad: 44, h: 42, font: "'Geist', system-ui, sans-serif" },
      lyra: { r: 0, rSm: 0, rBtn: 0, cardPad: 32, h: 36, font: "'Geist Mono', ui-monospace, monospace" }
    };
    var themes = {
      light: { bg: '#FFFFFF', muted2: '#F4F4F5', border: '#E4E4E7', input: '#E4E4E7', fg: '#09090B', muted: '#71717A', mutedBg: '#F4F4F5', primary: '#18181B', primaryFg: '#FAFAFA', imgBg: '#E4E4E7', imgFg: '#52525B', imgText: '#18181B', errBg: '#FEF2F2', errBorder: '#FECACA', errFg: '#991B1B' },
      dark: { bg: '#0A0A0A', muted2: '#171717', border: '#2A2A2A', input: '#333333', fg: '#FAFAFA', muted: '#A1A1A1', mutedBg: '#262626', primary: '#E5E5E5', primaryFg: '#171717', imgBg: '#1F1F1F', imgFg: '#8A8A8A', imgText: '#F4F4F5', errBg: '#2A0E0E', errBorder: '#7F1D1D', errFg: '#FCA5A5' }
    };
    // ---- Konfigurasi konten (di Filament: config / setting panel) ----
    var brand = 'Panel Admin';
    var tagline = 'Kelola pesanan, produk, dan laporan dalam satu panel yang rapi.';
    var socialConfig = [
      { label: 'Masuk dengan Google', icon: 'M21.8 10.2H12v3.9h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.7 0-.6 0-1.3-.2-1.9zM12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10 10 0 0 0 12 22zM6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.7a10 10 0 0 0 0 9.2zM12 5.9c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7.1l3.5 2.7C7 7.7 9.3 5.9 12 5.9z' },
      { label: 'Masuk dengan Microsoft', icon: 'M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z' },
      { label: 'Masuk dengan GitHub', icon: 'M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22' }
    ];
    // ---------------------------------------------------------------------

    var s = styles[this.props.style ?? 'nova'] || styles.nova;
    var themeMode = st.themeMode || 'system';
    var dark = themeMode === 'system' ? (this.props.dark ?? false) : themeMode === 'dark';
    var t = dark ? themes.dark : themes.light;
    var side = this.props.imageSide ?? 'kanan';

    var rings = [40, 80, 120, 170, 230, 300].map(function (r, i) { return { r: r, o: (0.5 - i * 0.07).toFixed(2) }; });
    var dots = [];
    for (var y = 0; y < 5; y++) for (var x = 0; x < 8; x++) dots.push({ x: 30 + x * 24, y: 300 + y * 24 });

    return {
      s: s, t: t, brand: brand, tagline: tagline, rings: rings, dots: dots,
      dir: side === 'kiri' ? 'row-reverse' : 'row',
      showError: !!(this.props.error ?? false),
      socials: socialConfig.map(function (so) { return { label: so.label, icon: so.icon, h: s.h, r: s.rBtn, border: t.input, bg: t.bg, fg: t.fg }; }),
      passType: st.showPass ? 'text' : 'password',
      passLabel: st.showPass ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi',
      passPressed: st.showPass ? 'true' : 'false',
      passIcon: st.showPass ? 'M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22' : 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      togglePass: function () { set({ showPass: !self.state.showPass }); },
      remember: !!st.remember, toggleRemember: function () { set({ remember: !self.state.remember }); },
      loading: !!st.loading, btnLabel: st.loading ? 'Memproses…' : 'Masuk', btnOpacity: st.loading ? 0.7 : 1,
      submit: function () { set({ loading: true }); setTimeout(function () { set({ loading: false }); }, 1500); },
      themeOpts: [
        { k: 'light', label: 'Terang', icon: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42' },
        { k: 'dark', label: 'Gelap', icon: 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' },
        { k: 'system', label: 'Ikuti sistem', icon: 'M2 3h20v14H2zM8 21h8M12 17v4' }
      ].map(function (o) {
        var on = o.k === themeMode;
        return { label: o.label, icon: o.icon, sel: on ? 'true' : 'false', r: s.rSm, bg: on ? t.mutedBg : 'transparent', fg: on ? t.fg : t.muted,
          pick: function () { set({ themeMode: o.k }); } };
      })
    };
  }
}
</script>
</body>
</html>
