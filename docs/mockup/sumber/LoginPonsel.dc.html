<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button,input{font-family:inherit}
input::placeholder{color:#8A8A93}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; padding: 12px 16px 24px; background: {{t.mutedBg}}; color: {{t.fg}}; font-family: {{s.font}}; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; gap: 20px;">

  <div style="align-self: stretch; display: flex; justify-content: flex-end;">
    <div role="radiogroup" aria-label="Tema tampilan" style="display: flex; gap: 2px; padding: 2px; border: 1px solid {{t.border}}; border-radius: {{s.rBtn}}px; background: {{t.bg}};">
      <sc-for list="{{themeOpts}}" as="th" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{th.sel}}" aria-label="{{th.label}}" title="{{th.label}}" onClick="{{th.pick}}" style="width: 40px; height: 40px; border: 0; border-radius: {{th.r}}px; background: {{th.bg}}; color: {{th.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{th.icon}}"></path></svg>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 20px; margin-top: 0px;">
    <a href="#" style="align-self: center; display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 16px;">
      <span style="width: 32px; height: 32px; border-radius: {{s.rSm}}px; background: {{t.primary}}; color: {{t.primaryFg}}; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21V12h6v9"></path></svg>
      </span>
      {{brand}}
    </a>

    <section style="border: 1px solid {{t.border}}; border-radius: {{s.r}}px; background: {{t.bg}}; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Selamat datang kembali</h1>
        <p style="margin: 0; color: {{t.mutedFg}};">Masuk dengan akun Google atau Microsoft</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{socials}}" as="so" hint-placeholder-count="2">
          <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 44px; border: 1px solid {{so.border}}; border-radius: {{so.r}}px; background: {{so.bg}}; color: {{so.fg}}; font-size: 14px; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{so.icon}}"></path></svg>
            {{so.label}}
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: {{t.mutedFg}};">
        <span style="flex-grow: 1; height: 1px; background: {{t.border}};"></span>atau dengan email<span style="flex-grow: 1; height: 1px; background: {{t.border}};"></span>
      </div>
      <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
        <div role="alert" style="padding: 10px 12px; border: 1px solid {{t.errBorder}}; border-radius: {{s.rBtn}}px; background: {{t.errBg}}; color: {{t.errFg}}; font-size: 13px;">Email atau kata sandi tidak cocok dengan data kami.</div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="lp-email" style="font-weight: 500;">Email</label>
        <input id="lp-email" type="email" inputMode="email" autoComplete="email" placeholder="nama@contoh.id" style="height: 44px; padding: 0 12px; border: 1px solid {{emailBorder}}; border-radius: {{s.rBtn}}px; background: transparent; color: {{t.fg}}; font-size: 16px; box-sizing: border-box; width: 100%; outline: none;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label for="lp-pass" style="font-weight: 500;">Kata sandi</label>
          <a href="#" style="font-size: 13px; text-underline-offset: 3px; padding: 4px 0;">Lupa kata sandi?</a>
        </div>
        <div style="position: relative;">
          <input id="lp-pass" type="{{passType}}" autoComplete="current-password" style="height: 44px; padding: 0 48px 0 12px; border: 1px solid {{t.input}}; border-radius: {{s.rBtn}}px; background: transparent; color: {{t.fg}}; font-size: 16px; box-sizing: border-box; width: 100%; outline: none;">
          <button type="button" onClick="{{togglePass}}" aria-label="{{passLabel}}" aria-pressed="{{passPressed}}" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: 0; background: transparent; color: {{t.mutedFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{passIcon}}"></path></svg>
          </button>
        </div>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer;">
        <input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{t.primary}};">
        Ingat saya di perangkat ini
      </label>
      <button type="button" onClick="{{submit}}" style="height: 44px; border: 0; border-radius: {{s.rBtn}}px; background: {{t.primary}}; color: {{t.primaryFg}}; font-size: 15px; font-weight: 500; cursor: pointer; opacity: {{btnOpacity}};">{{btnLabel}}</button>
      <p style="margin: 0; text-align: center; color: {{t.mutedFg}};">Belum punya akun? <a href="#" style="color: {{t.fg}}; text-underline-offset: 3px;">Daftar</a></p>
    </section>

    <p style="margin: 0; text-align: center; font-size: 12px; line-height: 1.6; color: {{t.mutedFg}};">Dengan melanjutkan, Anda menyetujui <a href="#" style="text-underline-offset: 3px;">Ketentuan Layanan</a> dan <a href="#" style="text-underline-offset: 3px;">Kebijakan Privasi</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"style":{"editor":"enum","default":"nova","options":["vega","nova","maia","lyra"],"section":"shadcn"},"dark":{"editor":"boolean","default":false,"section":"shadcn"},"error":{"editor":"boolean","default":false,"section":"Status"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPass: false, remember: true, loading: false, themeMode: 'system' };
  }
  renderVals() {
    var self = this, st = this.state || {};
    function set(o) { self.setState(o); }
    var styles = {
      vega: { r: 14, rSm: 8, rBtn: 8, font: "'Geist', system-ui, sans-serif" },
      nova: { r: 12, rSm: 6, rBtn: 6, font: "'Geist', system-ui, sans-serif" },
      maia: { r: 24, rSm: 999, rBtn: 999, font: "'Geist', system-ui, sans-serif" },
      lyra: { r: 0, rSm: 0, rBtn: 0, font: "'Geist Mono', ui-monospace, monospace" }
    };
    var themes = {
      light: { bg: '#FFFFFF', mutedBg: '#F4F4F5', border: '#E4E4E7', input: '#E4E4E7', fg: '#09090B', mutedFg: '#71717A', muted: '#F4F4F5', primary: '#18181B', primaryFg: '#FAFAFA', errBg: '#FEF2F2', errBorder: '#FECACA', errFg: '#991B1B' },
      dark: { bg: '#0A0A0A', mutedBg: '#171717', border: '#2A2A2A', input: '#333333', fg: '#FAFAFA', mutedFg: '#A1A1A1', muted: '#262626', primary: '#E5E5E5', primaryFg: '#171717', errBg: '#2A0E0E', errBorder: '#7F1D1D', errFg: '#FCA5A5' }
    };
    var s = styles[this.props.style ?? 'nova'] || styles.nova;
    var themeMode = st.themeMode || 'system';
    var dark = themeMode === 'system' ? (this.props.dark ?? false) : themeMode === 'dark';
    var t = dark ? themes.dark : themes.light;
    var showError = !!(this.props.error ?? false);

    // ---- Konfigurasi konten (di Filament: config / setting panel) ----
    var brand = 'Panel Admin';
    var socialConfig = [
      { label: 'Google', icon: 'M21.8 10.2H12v3.9h5.6a4.8 4.8 0 0 1-2.1 3.1M12 22a10 10 0 1 1 7-17.1' },
      { label: 'Microsoft', icon: 'M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z' }
    ];
    // ---------------------------------------------------------------------

    return {
      t: t, s: s, brand: brand, showError: showError, emailBorder: showError ? '#DC2626' : t.input,
      socials: socialConfig.map(function (so) { return { label: so.label, icon: so.icon, r: s.rBtn, border: t.input, bg: t.bg, fg: t.fg }; }),
      passType: st.showPass ? 'text' : 'password', passLabel: st.showPass ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi', passPressed: st.showPass ? 'true' : 'false',
      passIcon: st.showPass ? 'M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22' : 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      togglePass: function () { set({ showPass: !self.state.showPass }); },
      remember: !!st.remember, toggleRemember: function () { set({ remember: !self.state.remember }); },
      btnLabel: st.loading ? 'Memproses…' : 'Masuk', btnOpacity: st.loading ? 0.7 : 1,
      submit: function () { set({ loading: true }); setTimeout(function () { set({ loading: false }); }, 1500); },
      themeOpts: [
        { k: 'light', label: 'Terang', icon: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42' },
        { k: 'dark', label: 'Gelap', icon: 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' },
        { k: 'system', label: 'Ikuti sistem', icon: 'M2 3h20v14H2zM8 21h8M12 17v4' }
      ].map(function (o) { var on = o.k === themeMode; return { label: o.label, icon: o.icon, sel: on ? 'true' : 'false', r: s.rSm, bg: on ? t.muted : 'transparent', fg: on ? t.fg : t.mutedFg, pick: function () { set({ themeMode: o.k }); } }; })
    };
  }
}
</script>
</body>
</html>
